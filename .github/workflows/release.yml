name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install Velopack
        run: dotnet tool update -g vpk --version 1.2.0

      - name: Build
        run: cargo build --release -p nucleotide --bins

      - name: Clone Helix runtime
        shell: pwsh
        run: |
          git clone --depth 1 --branch 25.07.1 https://github.com/helix-editor/helix.git helix-temp
          try {
            .\scripts\setup-windows-runtime.cmd -RuntimeSource helix-temp\runtime -NuclExe target\release\nucl-grammar.exe
          } finally {
            Remove-Item -LiteralPath helix-temp -Recurse -Force
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          # 按 README 的说明，portable zip 是唯一 Windows 产物
          .\scripts\package-velopack.ps1 -RequireRemoteHelpers

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            **/*Portable*.zip
            **/*-Portable.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: brew install fontconfig pkg-config

      - name: Build
        run: cargo build --release

      - name: Bundle .app
        run: ./scripts/bundle-mac.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: Nucleotide.app

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libvulkan-dev pkg-config

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist/runtime
          cp target/release/nucl dist/
          cp -r runtime/* dist/runtime/
          tar -czf nucl-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: nucl-linux-x86_64.tar.gz

  publish:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; > ../SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.app
            SHA256SUMS