name: Portable Linux + macOS + Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs are pure waste: every job here compiles the Ghostty native
# library and two musl cross-builds from scratch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          # Matches rust-toolchain.toml. Keep the two in sync.
          toolchain: 1.98.0

      # setup-zig puts zig on PATH itself. The previous hand-rolled
      # curl + tar + GITHUB_PATH install is what let a stale 0.15.2 directory
      # name survive a 0.16.0 bump unnoticed, on all three platforms.
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false

      - name: Verify Zig
        run: zig version

      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libvulkan-dev libgl1-mesa-dev libssl-dev

      - name: Build
        run: cargo build --release -p nucleotide --bins -p nucleotide-remote

      # The Windows packaging step runs with -RequireRemoteHelpers, so the
      # helpers have to be produced somewhere. They are musl cross-builds, so
      # they are built here on Linux and handed over as an artifact rather than
      # re-created on the Windows runner, which cannot run build-remote-helpers.sh.
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Build Linux remote helpers
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          ./scripts/build-remote-helpers.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nucleotide-remote-helpers
          path: target/remote-helpers
          if-no-files-found: error

      - name: Fetch Helix runtime
        run: |
          set -euo pipefail
          HELIX_REV="$(sed -n 's/.*helix-loader = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml | head -n 1)"
          git clone --depth 1 https://github.com/helix-editor/helix.git helix-temp
          if [ -n "$HELIX_REV" ]; then
            git -C helix-temp fetch --depth 1 origin "$HELIX_REV"
            git -C helix-temp checkout --detach FETCH_HEAD
          fi
          mkdir -p nucleotide-linux/bin nucleotide-linux/share/nucleotide/runtime
          cp target/release/nucl nucleotide-linux/bin/
          cp target/release/nucleotide-remote nucleotide-linux/bin/ || true
          cp -r helix-temp/runtime/* nucleotide-linux/share/nucleotide/runtime/
          rm -rf helix-temp

      - name: Tarball
        run: tar -czf nucleotide-linux-x86_64.tar.gz nucleotide-linux

      - uses: actions/upload-artifact@v4
        with:
          name: nucleotide-linux-x86_64
          path: nucleotide-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          # Matches rust-toolchain.toml. Keep the two in sync.
          toolchain: 1.98.0
          targets: aarch64-apple-darwin

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false

      - name: Verify Zig
        run: zig version

      - name: Metal toolchain
        run: |
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent metalToolchain
          brew install fontconfig pkg-config || true

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin --bin nucl --bin nucl-grammar

      - name: Fetch Helix runtime
        run: |
          set -euo pipefail
          HELIX_REV="$(sed -n 's/.*helix-loader = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml | head -n 1)"
          git clone --depth 1 https://github.com/helix-editor/helix.git helix-temp
          if [ -n "$HELIX_REV" ]; then
            git -C helix-temp fetch --depth 1 origin "$HELIX_REV"
            git -C helix-temp checkout --detach FETCH_HEAD
          fi
          mkdir -p runtime
          cp -r helix-temp/runtime/* runtime/
          rm -rf helix-temp

      - name: Bundle .app
        run: |
          set -euo pipefail
          NUCL_BINARY="target/aarch64-apple-darwin/release/nucl" \
          ./scripts/bundle-mac.sh
          tar -czf Nucleotide-aarch64.app.tar.gz Nucleotide.app

      - uses: actions/upload-artifact@v4
        with:
          name: nucleotide-macos-aarch64
          path: Nucleotide-aarch64.app.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          # Matches rust-toolchain.toml. Keep the two in sync.
          toolchain: 1.98.0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false

      - name: Verify Zig
        run: zig version

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Velopack CLI
        run: dotnet tool update -g vpk --version 1.2.0

      - name: Build
        run: cargo build --release

      - name: Prepare bundled runtime
        shell: pwsh
        run: |
          # clone-helix-runtime.ps1 reads the pinned rev out of Cargo.toml, so
          # this job and the repo pin cannot drift the way an inlined clone can.
          .\scripts\clone-helix-runtime.ps1 -Destination helix-temp
          try {
            .\scripts\setup-windows-runtime.ps1 -RuntimeSource helix-temp\runtime -NuclExe target\release\nucl-grammar.exe -AllowGrammarFailures
          } finally {
            Remove-Item -LiteralPath helix-temp -Recurse -Force
          }

      - name: Verify grammar DLLs
        shell: pwsh
        run: |
          $grammarDlls = Get-ChildItem `
            -Path crates\nucleotide\runtime\grammars `
            -Filter *.dll `
            -File

          if ($grammarDlls.Count -eq 0) {
            throw "Windows package runtime does not contain any grammar DLLs."
          }

          Write-Host "Windows package runtime contains $($grammarDlls.Count) grammar DLL(s)."

          # The fetch step writes the tree-sitter grammar sources next to the
          # DLLs. They must not ship: they are large, and only the built DLLs
          # are loaded at runtime.
          $grammarSources = "crates\nucleotide\runtime\grammars\sources"
          if (Test-Path $grammarSources) {
            throw "Windows package runtime must not contain grammar sources: $grammarSources"
          }

      # Produced by the linux job; package-velopack.ps1 -RequireRemoteHelpers
      # throws without them.
      - name: Fetch Linux remote helpers
        uses: actions/download-artifact@v4
        with:
          name: nucleotide-remote-helpers
          path: target/remote-helpers

      - name: Package Velopack
        shell: pwsh
        run: .\scripts\package-velopack.ps1 -RequireRemoteHelpers

      - name: Locate portable bundle
        id: bundle
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Recurse -Filter *-Portable.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) { throw "No *-Portable.zip produced by package-velopack.ps1" }
          "zip_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: nucleotide-windows-x86_64
          path: |
            ${{ steps.bundle.outputs.zip_path }}
            **/RELEASES
            **/*.nupkg
          if-no-files-found: error
